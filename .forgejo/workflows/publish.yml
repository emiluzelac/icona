name: Publish to npm

# Publishes a version tag of @emiluzelac/icona. Icona's canonical repository is
# on our own (private) Forgejo since 2026-11-15, and so is its publishing:
# bump icona/package.json, push to main, then push a `v<version>` tag. The tag
# runs this workflow in a disposable VM: it builds and smoke-tests the package
# (what prepublishOnly runs), publishes it with the repository secret NPM_TOKEN
# (a granular npm token limited to this package, allowed to skip two-factor
# for automation), and creates the Forgejo release with the tarball attached
# and the commits since the previous tag as its notes. GitHub's copy is a push
# mirror and publishes nothing.
#
# Run it by hand (workflow_dispatch) to publish an existing tag again: a
# version npm already has is skipped. With `publish` off it does everything but
# publish: it checks the token (`npm whoami`), runs `npm publish --dry-run`,
# and creates and deletes a draft release, to prove the path works.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, e.g. v0.3.0
        required: true
      publish:
        description: Publish (off = build, test, dry-run publish and check the token only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish
    runs-on: [self-hosted, linux, x64, iam-ci-isolated]
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: The tag matches icona/package.json
        run: |
          version=$(node -p "require('./icona/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match icona/package.json version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Outside the workspace, so nothing of the release's own lands in the package.
      - name: Release notes from the commits since the previous tag
        run: |
          out=$(mktemp -d)
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "Published to npm: https://www.npmjs.com/package/@emiluzelac/icona/v/$VERSION"
            echo
            if [ -n "$prev" ]; then echo "Changes since $prev:"; echo; git log --no-merges --format='- %s' "$prev..$TAG"; fi
          } > "$out/notes.md"
          echo "RELEASE_DIR=$out" >> "$GITHUB_ENV"

      - name: Build and smoke-test (what prepublishOnly runs)
        run: npm --prefix icona ci && npm --prefix icona run build && npm --prefix icona test

      - name: The npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            if [ "$PUBLISH" = true ]; then echo "NPM_TOKEN is not set on this repository." >&2; exit 1; fi
            echo "NPM_TOKEN is not set: the dry run goes on without it."
          else
            echo "npm token belongs to: $(npm whoami)"
          fi

      - name: Publish to npm
        working-directory: icona
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$PUBLISH" != true ]; then
            npm publish --dry-run --ignore-scripts
          elif [ "$(npm view "@emiluzelac/icona@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "npm has @emiluzelac/icona@$VERSION already: skipped."
          else
            npm publish --ignore-scripts
          fi

      - name: Pack the tarball for the release
        run: |
          npm pack --ignore-scripts --pack-destination "$RELEASE_DIR" ./icona >/dev/null
          echo "TARBALL=$(ls "$RELEASE_DIR"/*.tgz)" >> "$GITHUB_ENV"

      # The helper comes from the workflow's own commit, so an older tag published
      # again (which predates it) works too.
      - name: The release helper
        run: |
          git -C "$RELEASE_DIR" init -q tools
          git -C "$RELEASE_DIR/tools" fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git -C "$RELEASE_DIR/tools" checkout -q FETCH_HEAD -- scripts/forgejo-release.mjs
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.extraHeader
          GIT_CONFIG_VALUE_0: "Authorization: token ${{ github.token }}"

      - name: The Forgejo release, with the tarball
        run: node "$RELEASE_DIR/tools/scripts/forgejo-release.mjs" "$TAG" "$RELEASE_DIR/notes.md" "$TARBALL" $([ "$PUBLISH" = true ] || echo --dry-run)
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
